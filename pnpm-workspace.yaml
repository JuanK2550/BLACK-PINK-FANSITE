# Paquetes del monorepo y versiones compartidas.

packages:
  - 'frontend'
  - 'backend/*'
  - 'shared/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: false

catalog:
  'sharp': '^0.34.0'
  '@nestjs/cli': '^11.0.0'
  '@nestjs/common': '^11.0.0'
  '@nestjs/config': '^4.0.0'
  '@nestjs/core': '^11.0.0'
  '@nestjs/platform-express': '^11.0.0'
  '@nestjs/schematics': '^11.0.0'
  '@nestjs/swagger': '^11.4.7'
  '@nestjs/testing': '^11.2.3'
  '@nestjs/throttler': '^6.4.0'
  'class-transformer': '^0.5.1'
  'compression': '^1.8.1'
  'class-validator': '^0.15.1'
  'helmet': '^8.1.0'
  'ioredis': '^5.11.1'
  'nestjs-pino': '^4.6.1'
  'pino': '^10.3.1'
  'pg': '^8.16.3'
  'pino-http': '^11.0.0'
  'reflect-metadata': '^0.2.2'
  'rxjs': '^7.8.2'
  'supertest': '^7.2.2'
