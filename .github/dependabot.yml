# Actualizaciones mensuales de dependencias, agrupadas por familia; las versiones mayores se deciden a mano.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 4
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencias]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      nestjs:
        patterns: ['@nestjs/*', 'rxjs', 'reflect-metadata', 'class-validator', 'class-transformer']
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom', 'next-intl']
      prisma:
        patterns: ['prisma', '@prisma/*']
      tests:
        patterns:
          [
            'vitest',
            '@vitest/*',
            '@testing-library/*',
            'jsdom',
            '@playwright/test',
            '@axe-core/*',
            'supertest',
            '@types/supertest',
          ]
      lint-formato:
        patterns:
          [
            'eslint',
            'eslint-*',
            '@eslint/*',
            'typescript-eslint',
            'prettier',
            'prettier-plugin-*',
            '@commitlint/*',
            'husky',
            'lint-staged',
          ]
      estilos:
        patterns: ['tailwindcss', '@tailwindcss/*', 'framer-motion']
      resto-menores:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    commit-message:
      prefix: 'ci'
    labels: [dependencias, ci]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      acciones:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /backend/api-gateway
      - /backend/content-service
      - /backend/media-service
      - /backend/chatbot-service
      - /backend/speech-service
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencias, docker]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      imagenes-base:
        patterns: ['*']
