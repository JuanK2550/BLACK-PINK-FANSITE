# Stack local completo: Postgres + Redis + los 5 microservicios.
#   Requisito previo:  pnpm setup   (crea el .env de la raiz)
#   Arranque:          pnpm docker:up
#
# El frontend NO esta aqui: se ejecuta con `pnpm dev:web` y se despliega en Vercel.

name: blackpink-fansite

x-service-defaults: &service-defaults
  restart: unless-stopped
  env_file:
    - ../.env
  networks:
    - bp-net

services:
  # ---------------------------------------------------------------- datos ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackpink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackpink_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-blackpink}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - bp-postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-blackpink} -d ${POSTGRES_DB:-blackpink}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bp-net

  redis:
    image: redis:7-alpine
    container_name: bp-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - bp-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bp-net

  # -------------------------------------------------------- microservicios ---
  content-service:
    <<: *service-defaults
    container_name: bp-content-service
    build:
      context: ..
      dockerfile: services/content-service/Dockerfile
    environment:
      DATABASE_URL_CONTENT: postgresql://${POSTGRES_USER:-blackpink}:${POSTGRES_PASSWORD:-blackpink_dev_password}@postgres:5432/${POSTGRES_DB:-blackpink}?schema=content
      REDIS_URL: redis://redis:6379
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # media-service NO tiene base de datos: no es dueno del contenido, solo de la
  # curaduria. Todo lo demas se lo pide a content-service por HTTP, y por eso
  # espera a que este sano antes de arrancar.
  media-service:
    <<: *service-defaults
    container_name: bp-media-service
    build:
      context: ..
      dockerfile: services/media-service/Dockerfile
    environment:
      CONTENT_SERVICE_URL: http://content-service:4001
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-4000}
      REDIS_URL: redis://redis:6379
    ports:
      - '4002:4002'
    depends_on:
      content-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatbot-service:
    <<: *service-defaults
    container_name: bp-chatbot-service
    build:
      context: ..
      dockerfile: services/chatbot-service/Dockerfile
    environment:
      DATABASE_URL_CHAT: postgresql://${POSTGRES_USER:-blackpink}:${POSTGRES_PASSWORD:-blackpink_dev_password}@postgres:5432/${POSTGRES_DB:-blackpink}?schema=chat
      REDIS_URL: redis://redis:6379
      CONTENT_SERVICE_URL: http://content-service:4001
    ports:
      - '4003:4003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  speech-service:
    <<: *service-defaults
    container_name: bp-speech-service
    build:
      context: ..
      dockerfile: services/speech-service/Dockerfile
    ports:
      - '4004:4004'

  api-gateway:
    <<: *service-defaults
    container_name: bp-api-gateway
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      CONTENT_SERVICE_URL: http://content-service:4001
      MEDIA_SERVICE_URL: http://media-service:4002
      CHATBOT_SERVICE_URL: http://chatbot-service:4003
      SPEECH_SERVICE_URL: http://speech-service:4004
      # Exime del limite por IP a las llamadas del renderizado en servidor, que
      # llegan todas desde la misma IP. Sin valor no hay exencion.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      - '4000:4000'
    depends_on:
      - content-service
      - media-service
      - chatbot-service
      - speech-service

volumes:
  bp-postgres-data:
  bp-redis-data:

networks:
  bp-net:
    driver: bridge
