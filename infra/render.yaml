# Los 5 servicios en un único servicio web GRATUITO de Render. Ver DEPLOY.md, paso 7.

services:
  - type: web
    name: blackpink-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: infra/todo-en-uno/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - shared/service-core/**
        - shared/types/**
        - shared/config/**
        - infra/todo-en-uno/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: '1'
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: DATABASE_URL_CONTENT
        sync: false
      - key: DIRECT_URL_CONTENT
        sync: false
      - key: DATABASE_URL_CHAT
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
