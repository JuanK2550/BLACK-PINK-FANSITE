# Lighthouse en cada pull request: rendimiento, accesibilidad, buenas prácticas y SEO.

name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (móvil y escritorio, mínimo 90)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Levantar la pila
        uses: ./.github/actions/levantar-pila

      - name: Lighthouse — escritorio
        run: pnpm dlx @lhci/cli@0.15 autorun --config=.github/lighthouse/escritorio.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Lighthouse — móvil
        if: ${{ !cancelled() }}
        run: pnpm dlx @lhci/cli@0.15 autorun --config=.github/lighthouse/movil.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Informes de Lighthouse
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: lighthouse-informes/
          retention-days: 14
