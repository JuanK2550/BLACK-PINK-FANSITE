# Pruebas del navegador con Playwright y axe sobre el sitio completo.

name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      chat_real:
        description: 'Probar el chat contra Gemini de verdad (gasta cuota)'
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (escritorio y móvil) + axe
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Levantar la pila
        uses: ./.github/actions/levantar-pila

      - name: Clave de Gemini (solo si se pidió el chat real)
        if: ${{ inputs.chat_real }}
        env:
          CLAVE: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: |
          sed -i "s|^GOOGLE_AI_API_KEY=.*|GOOGLE_AI_API_KEY=${CLAVE}|" .env
          docker compose --env-file .env -f infra/docker-compose.yml up -d --force-recreate chatbot-service
          for i in $(seq 1 30); do curl -fsS http://localhost:4003/health && exit 0; sleep 3; done
          exit 1

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_CHAT_REAL: ${{ inputs.chat_real && '1' || '0' }}
        run: pnpm test:e2e

      - name: Informe de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Logs de los servicios si algo falló
        if: ${{ failure() }}
        run: docker compose -f infra/docker-compose.yml logs --tail 200
