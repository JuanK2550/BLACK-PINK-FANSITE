name: Refresco de contenido

# Cron semanal que hace dos cosas que, sin él, solo ocurrían al desplegar:
#
#   1. REVALIDA LA CACHÉ ISR de la web (`POST /api/revalidate`). Las páginas
#      se regeneran solas cada hora, pero la caché de `fetch` y las páginas
#      estáticas del build pueden quedarse con datos de hace días si nadie las
#      visita; esto las tira todas de una vez.
#   2. REGENERA EL ÍNDICE VECTORIAL DE PINKY (`POST /api/v1/admin/reindex` en
#      chatbot-service). El índice se construía solo al arrancar el servicio:
#      un hito nuevo en la cronología no llegaba al chat hasta el siguiente
#      despliegue.
#
# Los dos endpoints están protegidos con secretos comparados en tiempo
# constante y responden 404 sin ellos, así que desde fuera no se sabe ni que
# existen. El de reindexado NO pasa por el gateway: no está en su lista blanca.
#
# El reindexado responde 202 y sigue en segundo plano; tarda minutos por la
# pausa entre lotes que protege la cuota gratuita de Gemini. Este workflow no
# espera a que termine: lo que comprueba es que el servicio lo ACEPTÓ.
#
# Secretos:
#   SITE_URL             https://... de la web en producción
#   REVALIDATE_SECRET    el mismo valor que tiene la web en Vercel
#   CHATBOT_URL          https://... de chatbot-service (su URL directa)
#   INTERNAL_API_KEY     el mismo valor que tiene chatbot-service

on:
  schedule:
    # Lunes a las 04:41 UTC, después del volcado diario de las 03:17.
    - cron: '41 4 * * 1'
  workflow_dispatch:

concurrency:
  group: content-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refrescar:
    name: Revalidar ISR y reindexar PINKY
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Revalidar la caché ISR
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SECRETO: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$SECRETO" ]; then
            echo "::warning::Faltan SITE_URL o REVALIDATE_SECRET: no se revalida."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "${SITE_URL%/}/api/revalidate" \
            -H "Authorization: Bearer ${SECRETO}"

      - name: Reindexar el chatbot
        env:
          CHATBOT_URL: ${{ secrets.CHATBOT_URL }}
          CLAVE: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          if [ -z "$CHATBOT_URL" ] || [ -z "$CLAVE" ]; then
            echo "::warning::Faltan CHATBOT_URL o INTERNAL_API_KEY: no se reindexa."
            exit 0
          fi
          estado=$(curl -sS -o respuesta.json -w '%{http_code}' -X POST \
            "${CHATBOT_URL%/}/api/v1/admin/reindex" -H "x-internal-key: ${CLAVE}")
          cat respuesta.json; echo
          case "$estado" in
            202) echo "Reindexado aceptado; sigue en segundo plano." ;;
            # 409 = ya había uno en marcha. No es un fallo: el índice se está
            # rehaciendo igualmente.
            409) echo "::notice::Ya había un reindexado en curso." ;;
            # 404 aquí casi siempre es la clave equivocada: el endpoint responde
            # 404 y no 401 para no confirmar que existe.
            404) echo "::error::404: revisa INTERNAL_API_KEY (el endpoint no confirma si existe)."; exit 1 ;;
            *) echo "::error::Respuesta inesperada: $estado"; exit 1 ;;
          esac
