# CI: lint, tipos, tests y build en cada push y pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blackpink
          POSTGRES_PASSWORD: blackpink_dev_password
          POSTGRES_DB: blackpink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackpink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Preparar entorno
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Cobertura del frontend (mínimo 60%)
        run: pnpm test:coverage

      - name: Formato
        run: pnpm format:check

      - name: Contraste AA de los tokens
        run: pnpm check:contrast

      - name: Volcados de Spotify (ida y vuelta)
        run: |
          pnpm --filter @blackpink/content-service db:migrate
          pnpm --filter @blackpink/content-service db:seed
          pnpm check:spotify

      - name: Galería (disco contra volcado)
        run: pnpm check:gallery

      - name: Build
        run: pnpm build
